name: FlinkFin
options:
  bundleIdPrefix: com.yourname  # ← Replace with your own bundle ID prefix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FlinkFin:
    type: application
    platform: iOS
    sources:
      - path: FlinkFin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.flinkfin  # ← Replace with your bundle ID
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FlinkFin"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
